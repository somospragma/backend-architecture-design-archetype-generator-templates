name: postgresql
type: driven
description: PostgreSQL database adapter using Spring Data R2DBC
suffix: "Adapter"
needsMapper: true

dependencies:
  - group: org.springframework.boot
    artifact: spring-boot-starter-data-r2dbc
  - group: org.postgresql
    artifact: r2dbc-postgresql

testDependencies:
  - group: io.r2dbc
    artifact: r2dbc-h2
    scope: test

applicationPropertiesTemplate: application-properties.yml.ftl

configurationClasses:
  - name: R2dbcConfig
    packagePath: config
    templatePath: R2dbcConfig.java.ftl
