name: sqs-consumer
type: input
description: SQS Consumer entry point using Spring Cloud AWS

dependencies:
  - group: io.awspring.cloud
    artifact: spring-cloud-aws-starter-sqs
    versionRef: spring-cloud-aws
  - group: software.amazon.awssdk
    artifact: sqs
    versionRef: aws-sdk

testDependencies:
  - group: org.testcontainers
    artifact: localstack
    versionRef: testcontainers
    scope: test
  - group: org.testcontainers
    artifact: junit-jupiter
    versionRef: testcontainers
    scope: test
  - group: org.awaitility
    artifact: awaitility
    scope: test

applicationPropertiesTemplate: application-properties.yml.ftl

configurationClasses:
  - name: SqsConsumerConfig
    packagePath: config
    templatePath: Config.java.ftl
