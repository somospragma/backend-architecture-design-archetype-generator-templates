name: http-client
type: driven
description: HTTP Client adapter using RestClient (Spring 6.1+)
suffix: "Adapter"
needsMapper: true

dependencies:
  - group: org.springframework.boot
    artifact: spring-boot-starter-web
  # Spring Boot 4 ships RestTemplateBuilder in its own module
  - group: org.springframework.boot
    artifact: spring-boot-starter-restclient

testDependencies:
  - group: org.springframework.boot
    artifact: spring-boot-starter-test
    scope: test

applicationPropertiesTemplate: application-properties.yml.ftl

configurationClasses:
  - name: RestTemplateConfig
    packagePath: config
    templatePath: Config.java.ftl
