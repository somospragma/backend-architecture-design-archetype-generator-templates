name: dynamodb
type: driven
description: DynamoDB adapter using AWS SDK v2 synchronous client
suffix: "Adapter"
needsMapper: true

dependencies:
  - group: software.amazon.awssdk
    artifact: dynamodb
    versionRef: aws-sdk

testDependencies:
  - group: org.testcontainers
    artifact: localstack
    versionRef: testcontainers
    scope: test
  - group: org.testcontainers
    artifact: junit-jupiter
    versionRef: testcontainers
    scope: test

applicationPropertiesTemplate: application-properties.yml.ftl

configurationClasses:
  - name: DynamoDbConfig
    packagePath: config
    templatePath: Config.java.ftl
