name: redis
type: driven
description: Redis cache adapter using Spring Data Redis
suffix: "Adapter"
needsMapper: true

dependencies:
  - group: org.springframework.boot
    artifact: spring-boot-starter-data-redis
  # Jackson 3 for the JSON value serializer (Boot 4 no longer ships Jackson 2)
  - group: org.springframework.boot
    artifact: spring-boot-starter-jackson
  - group: io.lettuce
    artifact: lettuce-core

testDependencies:
  - group: it.ozimov
    artifact: embedded-redis
    versionRef: embedded-redis
    scope: test

applicationPropertiesTemplate: application-properties.yml.ftl

configurationClasses:
  - name: RedisConfig
    packagePath: config
    templatePath: Config.java.ftl

buildConfiguration: |
  // embedded-redis (tests) brings old Guava and commons-io with known vulnerabilities
  rootProject.allprojects {
      configurations.configureEach {
          resolutionStrategy.eachDependency {
              when {
                  requested.group == "com.google.guava" && requested.name == "guava" ->
                      useVersion("${versions.libraries["guava"]}")
                  requested.group == "commons-io" && requested.name == "commons-io" ->
                      useVersion("${versions.libraries["commons-io"]}")
              }
          }
      }
  }
