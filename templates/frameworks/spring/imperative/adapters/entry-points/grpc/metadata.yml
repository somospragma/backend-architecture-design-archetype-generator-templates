name: grpc
type: input
description: gRPC entry point using gRPC Spring Boot Starter
suffix: GrpcService

dependencies:
  - group: net.devh
    artifact: grpc-server-spring-boot-starter
    version: 2.15.0.RELEASE
  - group: io.grpc
    artifact: grpc-stub
    version: 1.58.0
  - group: io.grpc
    artifact: grpc-protobuf
    version: 1.58.0
  - group: javax.annotation
    artifact: javax.annotation-api
    version: 1.3.2

testDependencies:
  - group: net.devh
    artifact: grpc-client-spring-boot-starter
    version: 2.15.0.RELEASE
    scope: test

applicationPropertiesTemplate: application-properties.yml.ftl

additionalResources:
  - name: service.proto
    targetPath: proto
    templatePath: service.proto.ftl

buildPlugins:
  - id: com.google.protobuf
    version: 0.9.4

buildConfiguration: |
  protobuf {
      protoc {
          artifact = "com.google.protobuf:protoc:3.24.0"
      }
      plugins {
          create("grpc") {
              artifact = "io.grpc:protoc-gen-grpc-java:1.58.0"
          }
      }
      generateProtoTasks {
          all().forEach { task ->
              task.plugins {
                  create("grpc")
              }
          }
      }
  }
  
  sourceSets {
      main {
          proto {
              srcDir("${resourcesPath}/proto")
          }
      }
  }
