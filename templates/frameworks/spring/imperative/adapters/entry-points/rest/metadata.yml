name: rest
type: driving
description: REST API controller using Spring MVC
suffix: "Controller"
applicationPropertiesTemplate: "application-properties.yml.ftl"

dependencies:
  - group: org.springframework.boot
    artifact: spring-boot-starter-web
    version: 3.2.0
  - group: org.springframework.boot
    artifact: spring-boot-starter-validation
    version: 3.2.0
  - group: io.springdoc
    artifact: springdoc-openapi-starter-webmvc-ui
    version: 2.3.0

testDependencies:
  - group: org.springframework.boot
    artifact: spring-boot-starter-test
    version: 3.2.0
    scope: test
