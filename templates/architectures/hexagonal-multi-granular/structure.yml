architecture: "hexagonal-multi-granular"
description: "Hexagonal architecture with granular modules - each adapter is a separate module"
multiModule: true
moduleType: "multi-granular"

# Static files to be copied from template to project
staticFiles:
  # Docker configuration
  - source: "project/Dockerfile.ftl"
    destination: "Dockerfile"
    description: "Multi-stage Dockerfile with jlink optimization"
  
  - source: "project/.dockerignore.ftl"
    destination: ".dockerignore"
    description: "Docker ignore file"
  
  # Architecture tests (in app-service module)
  - source: "tests/architecture/ArchitectureTest.java.ftl"
    destination: "application/app-service/src/test/java/{basePackage}/architecture/ArchitectureTest.java"
    description: "ArchUnit tests for architecture validation"
    
  - source: "tests/architecture/NamingConventionTest.java.ftl"
    destination: "application/app-service/src/test/java/{basePackage}/architecture/NamingConventionTest.java"
    description: "ArchUnit tests for naming conventions"
    
  - source: "tests/architecture/ImmutabilityTest.java.ftl"
    destination: "application/app-service/src/test/java/{basePackage}/architecture/ImmutabilityTest.java"
    description: "ArchUnit tests for immutability rules"

# Adapter path resolution
# Placeholders: {name}, {type}, {basePackage}
adapterPaths:
  driven: "infrastructure/driven-adapters/{name}"
  driving: "infrastructure/entry-points/{name}"

# Carpetas organizadoras (NO son módulos de Gradle)
folders:
  - "domain"
  - "application"
  - "infrastructure"
  - "infrastructure/driven-adapters"
  - "infrastructure/entry-points"

# Módulos iniciales (se crean al hacer initCleanArch)
modules:
  # Domain modules
  - name: "model"
    path: "domain/model"
    description: "Domain entities and value objects"
    packagePath: "domain.model"
    dependencies: []
    
  - name: "ports"
    path: "domain/ports"
    description: "Input and output ports (interfaces)"
    packagePath: "domain.port"
    dependencies:
      - "model"
    
  - name: "usecase"
    path: "domain/usecase"
    description: "Use case implementations"
    packagePath: "domain.usecase"
    dependencies:
      - "model"
      - "ports"
  
  # Application module
  - name: "app-service"
    path: "application/app-service"
    description: "Main application that wires everything"
    packagePath: "config"
    dependencies:
      - "model"
      - "ports"
      - "usecase"

# Nota: Los adaptadores (entry-points y driven-adapters) se crean dinámicamente
# cuando se ejecutan los comandos generateInputAdapter o generateOutputAdapter
