architecture: "hexagonal-multi-granular"
description: "Hexagonal architecture with granular modules - each adapter is a separate module"
multiModule: true
moduleType: "multi-granular"
resourcesPath: "applications/app-service/src/main/resources"

# Static files to be copied from template to project
staticFiles:
  # Gradle Wrapper (Gradle 8.5 for PIT compatibility)
  - source: "project/gradlew"
    destination: "gradlew"
    description: "Gradle wrapper script for Unix"
    processAsTemplate: false
    binary: false
    executable: true
    
  - source: "project/gradlew.bat"
    destination: "gradlew.bat"
    description: "Gradle wrapper script for Windows"
    processAsTemplate: false
    binary: false
    executable: false
    
  - source: "project/gradle/wrapper/gradle-wrapper.properties"
    destination: "gradle/wrapper/gradle-wrapper.properties"
    description: "Gradle wrapper properties (version 8.5)"
    
  - source: "project/gradle/wrapper/gradle-wrapper.jar"
    destination: "gradle/wrapper/gradle-wrapper.jar"
    description: "Gradle wrapper JAR"
    processAsTemplate: false
    binary: true
    executable: false
  
  # Docker configuration
  - source: "project/Dockerfile.ftl"
    destination: "Dockerfile"
    description: "Multi-stage Dockerfile with jlink optimization"
  
  - source: "project/.dockerignore.ftl"
    destination: ".dockerignore"
    description: "Docker ignore file"
  
  # Architecture tests (in app-service module)
  - source: "tests/architecture/ArchitectureTest.java.ftl"
    destination: "application/app-service/src/test/java/{basePackage}/architecture/ArchitectureTest.java"
    description: "ArchUnit tests for architecture validation"
    
  - source: "tests/architecture/NamingConventionTest.java.ftl"
    destination: "application/app-service/src/test/java/{basePackage}/architecture/NamingConventionTest.java"
    description: "ArchUnit tests for naming conventions"
    
  - source: "tests/architecture/ImmutabilityTest.java.ftl"
    destination: "application/app-service/src/test/java/{basePackage}/architecture/ImmutabilityTest.java"
    description: "ArchUnit tests for immutability rules"

  # Build system files
  - source: "project/gradle.properties.ftl"
    destination: "gradle.properties"
    description: "Gradle properties with performance settings"

  - source: "project/main.gradle.ftl"
    destination: "main.gradle"
    description: "Quality tools configuration (JaCoCo, PIT, SonarQube, OWASP, MapStruct)"

  - source: "project/libs.versions.toml.ftl"
    destination: "gradle/libs.versions.toml"
    description: "Centralized dependency version catalog"

  - source: "project/lombok.config.ftl"
    destination: "lombok.config"
    description: "Lombok configuration"

  # Configuration classes (in app-service module)
  - source: "project/UseCasesConfig.java.ftl"
    destination: "application/app-service/src/main/java/{configPackagePath}/UseCasesConfig.java"
    description: "Use case component scan configuration"

  - source: "project/ErrorType.java.ftl"
    destination: "application/app-service/src/main/java/{configPackagePath}/ErrorType.java"
    description: "Standard error type enum"

# Adapter path resolution
# Placeholders: {name}, {type}, {basePackage}
adapterPaths:
  driven: "infrastructure/driven-adapters/{name}"
  driving: "infrastructure/entry-points/{name}"

# Module configuration for entity and use case generation
entityModule: "model"
useCaseModule: "usecases"

# Carpetas organizadoras (NO son módulos de Gradle)
folders:
  - "domain"
  - "application"
  - "infrastructure"
  - "infrastructure/driven-adapters"
  - "infrastructure/entry-points"

# Módulos iniciales (se crean al hacer initCleanArch)
modules:
  # Domain modules
  - name: "model"
    path: "domain/model"
    description: "Domain entities and value objects"
    packagePath: "domain.model"
    dependencies: []
    packageTypes:
      model: ""
    
  - name: "ports"
    path: "domain/ports"
    description: "Input and output ports (interfaces)"
    packagePath: "domain.ports"
    dependencies:
      - "model"
    packageTypes:
      ports: ""
    
  - name: "usecases"
    path: "domain/usecases"
    description: "Use case implementations"
    packagePath: "domain.usecases"
    dependencies:
      - "model"
      - "ports"
    packageTypes:
      usecases: ""
  
  # Infrastructure helpers module
  - name: "helpers"
    path: "infrastructure/helpers"
    description: "Shared cross-cutting utilities"
    packagePath: "infrastructure.helpers"
    dependencies:
      - "model"
      - "ports"

  # Application module
  - name: "app-service"
    path: "application/app-service"
    description: "Main application that wires everything"
    packagePath: "config"
    dependencies:
      - "model"
      - "ports"
      - "usecases"

# Nota: Los adaptadores (entry-points y driven-adapters) se crean dinámicamente
# cuando se ejecutan los comandos generateInputAdapter o generateOutputAdapter
