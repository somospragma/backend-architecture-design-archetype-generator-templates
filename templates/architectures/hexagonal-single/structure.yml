architecture: "hexagonal-single"
description: "Single module hexagonal architecture (ports & adapters)"
multiModule: false
resourcesPath: "src/main/resources"

# Static files to be copied from template to project
staticFiles:
  # Gradle Wrapper (Gradle 8.5 for PIT compatibility)
  - source: "project/gradlew"
    destination: "gradlew"
    description: "Gradle wrapper script for Unix"
    processAsTemplate: false
    binary: false
    executable: true
    
  - source: "project/gradlew.bat"
    destination: "gradlew.bat"
    description: "Gradle wrapper script for Windows"
    processAsTemplate: false
    binary: false
    executable: false
    
  - source: "project/gradle/wrapper/gradle-wrapper.properties"
    destination: "gradle/wrapper/gradle-wrapper.properties"
    description: "Gradle wrapper properties (version 8.5)"
    
  - source: "project/gradle/wrapper/gradle-wrapper.jar"
    destination: "gradle/wrapper/gradle-wrapper.jar"
    description: "Gradle wrapper JAR"
    processAsTemplate: false
    binary: true
    executable: false
  
  # Docker configuration
  - source: "project/Dockerfile.ftl"
    destination: "Dockerfile"
    description: "Multi-stage Dockerfile with jlink optimization"
  
  - source: "project/.dockerignore.ftl"
    destination: ".dockerignore"
    description: "Docker ignore file"
  
  # Architecture tests
  - source: "tests/architecture/ArchitectureTest.java.ftl"
    destination: "src/test/java/{basePackage}/architecture/ArchitectureTest.java"
    description: "ArchUnit tests for architecture validation"
    
  - source: "tests/architecture/NamingConventionTest.java.ftl"
    destination: "src/test/java/{basePackage}/architecture/NamingConventionTest.java"
    description: "ArchUnit tests for naming conventions"
    
  - source: "tests/architecture/ImmutabilityTest.java.ftl"
    destination: "src/test/java/{basePackage}/architecture/ImmutabilityTest.java"
    description: "ArchUnit tests for immutability rules"

# Adapter path resolution
# Placeholders: {name}, {type}, {basePackage}
adapterPaths:
  driven: "infrastructure/driven-adapters/{name}"
  driving: "infrastructure/entry-points/{name}"

# Package name transformations
packageMappings:
  rules:
    removeHyphens: true
    slashToDot: true
  replacements:
    entry-points: "entrypoints"
    driven-adapters: "drivenadapters"

# Module configuration for entity and use case generation
entityModule: "domain"
useCaseModule: "application"

directories:
  - "src/main/java"
  - "src/main/resources"
  - "src/test/java"
  - "src/test/resources"

packages:
  - "domain/model"
  - "domain/port/in"
  - "domain/port/out"
  - "application/usecase"
  - "infrastructure/entry-points/rest"
  - "infrastructure/driven-adapters"
  - "infrastructure/config"

# Module metadata for package type resolution
moduleMetadata:
  - name: "domain"
    path: "."
    packageTypes:
      model: "domain/model"
      portIn: "domain/port/in"
      portOut: "domain/port/out"
  - name: "application"
    path: "."
    packageTypes:
      usecase: "application/usecase"
  - name: "infrastructure"
    path: "."
    packageTypes:
      entryPoints: "infrastructure/entry-points"
      drivenAdapters: "infrastructure/driven-adapters"
      config: "infrastructure/config"
