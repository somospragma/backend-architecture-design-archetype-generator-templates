architecture: "hexagonal-multi"
description: "Multi-module hexagonal architecture with 3 modules: domain, application, infrastructure"
multiModule: true
moduleType: "multi"

# Static files to be copied from template to project
staticFiles:
  # Gradle Wrapper (Gradle 8.5 for PIT compatibility)
  - source: "project/gradlew"
    destination: "gradlew"
    description: "Gradle wrapper script for Unix"
    processAsTemplate: false
    binary: false
    executable: true
    
  - source: "project/gradlew.bat"
    destination: "gradlew.bat"
    description: "Gradle wrapper script for Windows"
    processAsTemplate: false
    binary: false
    executable: false
    
  - source: "project/gradle/wrapper/gradle-wrapper.properties"
    destination: "gradle/wrapper/gradle-wrapper.properties"
    description: "Gradle wrapper properties (version 8.5)"
    
  - source: "project/gradle/wrapper/gradle-wrapper.jar"
    destination: "gradle/wrapper/gradle-wrapper.jar"
    description: "Gradle wrapper JAR"
    processAsTemplate: false
    binary: true
    executable: false
  
  # Docker configuration
  - source: "project/Dockerfile.ftl"
    destination: "Dockerfile"
    description: "Multi-stage Dockerfile with jlink optimization"
  
  - source: "project/.dockerignore.ftl"
    destination: ".dockerignore"
    description: "Docker ignore file"
  
  # Architecture tests (in infrastructure module)
  - source: "tests/architecture/ArchitectureTest.java.ftl"
    destination: "infrastructure/src/test/java/{basePackage}/architecture/ArchitectureTest.java"
    description: "ArchUnit tests for architecture validation"
    
  - source: "tests/architecture/NamingConventionTest.java.ftl"
    destination: "infrastructure/src/test/java/{basePackage}/architecture/NamingConventionTest.java"
    description: "ArchUnit tests for naming conventions"
    
  - source: "tests/architecture/ImmutabilityTest.java.ftl"
    destination: "infrastructure/src/test/java/{basePackage}/architecture/ImmutabilityTest.java"
    description: "ArchUnit tests for immutability rules"

# Package name transformations
packageMappings:
  rules:
    removeHyphens: true
    slashToDot: true
  replacements:
    entry-points: "entrypoints"
    driven-adapters: "drivenadapters"

# Module configuration
entityModule: "domain"
useCaseModule: "application"

# Adapter path resolution
# Placeholders: {name}, {type}, {basePackage}
adapterPaths:
  driven: "infrastructure/driven-adapters/{name}"
  driving: "infrastructure/entry-points/{name}"

modules:
  - name: "domain"
    path: "domain"
    description: "Domain layer - Business logic and rules"
    dependencies: []
    packages:
      - "model"
      - "port/in"
      - "port/out"
    packageTypes:
      model: "model"
      portIn: "port/in"
      portOut: "port/out"
    directories:
      - "src/main/java"
      - "src/test/java"
  
  - name: "application"
    path: "application"
    description: "Application layer - Use case orchestration"
    dependencies:
      - "domain"
    packages:
      - "usecase"
    packageTypes:
      usecase: "usecase"
    directories:
      - "src/main/java"
      - "src/test/java"
  
  - name: "infrastructure"
    path: "infrastructure"
    description: "Infrastructure layer - Adapters and technical details"
    dependencies:
      - "domain"
      - "application"
    packages:
      - "entry-points/rest"
      - "driven-adapters"
      - "config"
    packageTypes:
      entryPoints: "entry-points"
      drivenAdapters: "driven-adapters"
      config: "config"
    directories:
      - "src/main/java"
      - "src/main/resources"
      - "src/test/java"
      - "src/test/resources"
