architecture: "onion-single"
description: "Onion architecture in a single module, for small projects that will not grow into several modules"
multiModule: false
resourcesPath: "src/main/resources"

# Onion keeps the dependency rule of clean architecture with fewer pieces than
# hexagonal, which suits small services:
#
#   domain.model          entities and value objects (the core, depends on nothing)
#   domain.gateway        interfaces for what the domain needs from outside
#                         (persistence, messaging, external APIs); depends on model
#   application.usecase   use cases, plain classes that orchestrate the domain
#   infrastructure.*      outer ring: entry points call use cases directly,
#                         driven adapters implement the domain gateways
#
# Unlike hexagonal there are no input ports: entry points depend on the use
# case class. ArchUnit tests in tests/architecture enforce these rules.
useCaseInputPorts: false

# Static files to be copied from template to project
# These files are processed as FreeMarker templates and copied to the specified destination
staticFiles:
  # Gradle Wrapper (version from versions.yml)
  - source: "project/gradlew"
    destination: "gradlew"
    description: "Gradle wrapper script for Unix"
    processAsTemplate: false
    binary: false
    executable: true
    
  - source: "project/gradlew.bat"
    destination: "gradlew.bat"
    description: "Gradle wrapper script for Windows"
    processAsTemplate: false
    binary: false
    executable: false
    
  - source: "project/gradle/wrapper/gradle-wrapper.properties"
    destination: "gradle/wrapper/gradle-wrapper.properties"
    description: "Gradle wrapper properties (version from versions.yml)"
    binary: false
    executable: false
    
  - source: "project/gradle/wrapper/gradle-wrapper.jar"
    destination: "gradle/wrapper/gradle-wrapper.jar"
    description: "Gradle wrapper JAR"
    processAsTemplate: false
    binary: true
    executable: false
  
  # Docker configuration
  - source: "project/Dockerfile.ftl"
    destination: "Dockerfile"
    description: "Multi-stage Dockerfile with jlink optimization"
  
  - source: "project/.dockerignore.ftl"
    destination: ".dockerignore"
    description: "Docker ignore file"
  
  # Architecture tests
  - source: "tests/architecture/ArchitectureTest.java.ftl"
    destination: "src/test/java/{basePackage}/architecture/ArchitectureTest.java"
    description: "ArchUnit tests for architecture validation"
    
  - source: "tests/architecture/NamingConventionTest.java.ftl"
    destination: "src/test/java/{basePackage}/architecture/NamingConventionTest.java"
    description: "ArchUnit tests for naming conventions"
    
  - source: "tests/architecture/ImmutabilityTest.java.ftl"
    destination: "src/test/java/{basePackage}/architecture/ImmutabilityTest.java"
    description: "ArchUnit tests for immutability rules"

  # Build system files
  - source: "project/gradle.properties.ftl"
    destination: "gradle.properties"
    description: "Gradle properties with performance settings"

  - source: "project/main.gradle.ftl"
    destination: "main.gradle"
    description: "Quality tools configuration (JaCoCo, PIT, SonarQube, OWASP, MapStruct)"

  - source: "project/libs.versions.toml.ftl"
    destination: "gradle/libs.versions.toml"
    description: "Centralized dependency version catalog"

  - source: "project/lombok.config.ftl"
    destination: "lombok.config"
    description: "Lombok configuration"

  # Configuration classes
  - source: "project/UseCasesConfig.java.ftl"
    destination: "{configPackagePath}/UseCasesConfig.java"
    description: "Use case component scan configuration"

  - source: "project/ErrorType.java.ftl"
    destination: "{configPackagePath}/ErrorType.java"
    description: "Standard error type enum"

# Adapter path resolution
# Placeholders: {name}, {type}, {basePackage}
adapterPaths:
  driven: "infrastructure/driven-adapters/{name}"
  driving: "infrastructure/entry-points/{name}"

# Package name transformations
packageMappings:
  rules:
    removeHyphens: true
    slashToDot: true
  replacements:
    entry-points: "entrypoints"
    driven-adapters: "drivenadapters"

# Module configuration for entity and use case generation
entityModule: "domain"
useCaseModule: "application"

directories:
  - "src/main/java"
  - "src/main/resources"
  - "src/test/java"
  - "src/test/resources"

packages:
  - "domain/model"
  - "domain/gateway"
  - "application/usecase"
  - "infrastructure/entry-points"
  - "infrastructure/driven-adapters"
  - "infrastructure/config"

# Rings of the onion, from the core outwards. "ports" is where generated
# gateways go; onion calls them domain gateways.
moduleMetadata:
  - name: "domain"
    path: "."
    packageTypes:
      model: "domain/model"
      ports: "domain/gateway"
  - name: "application"
    path: "."
    packageTypes:
      usecases: "application/usecase"
  - name: "infrastructure"
    path: "."
    packageTypes:
      entryPoints: "infrastructure/entry-points"
      drivenAdapters: "infrastructure/driven-adapters"
      config: "infrastructure/config"
