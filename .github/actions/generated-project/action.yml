name: Generated project
description: >-
  Restores a project uploaded by generation.yml (keep-projects) into
  generated/<name> in the workspace, ready to build: Java, Gradle and, for core-main, the
  plugin in mavenLocal.
inputs:
  name:
    description: Project name, <architecture>-<paradigm>
    required: true
  plugin:
    description: core-main or released, as passed to generation.yml
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: project-${{ inputs.name }}
        path: generated/${{ inputs.name }}
    - if: inputs.plugin == 'core-main'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: plugin-full-core-main
        path: ~/.m2/repository/co/com/pragma
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    # Artifacts do not keep file modes
    - shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: chmod +x "generated/$NAME/gradlew"
