# develop is the integration branch; v1, v2... are what each plugin major reads.
# main is frozen: plugins 1.0.x read it.
#
# Quality (CI)   contract of the templates; a PR to v* must come from develop
# Security (CI)  secrets in the history, security lint of the workflows
# Build          every architecture x paradigm generated, built, tested and its
#                dependencies scanned; on a promotion PR also with the released plugin
# Approval       promotion PR (develop → v1): a reviewer of the `promote`
#                environment approves; ci-ok stays pending until then
# Deploy (CD)    the merge into v1 is what users read; it gets the next v1.x.y tag
name: CI

on:
  pull_request:
    branches: [develop, 'v[0-9]*']
  push:
    branches: [develop, 'v[0-9]*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIZMOR_VERSION: 1.31.1
  ACTIONLINT_VERSION: 1.7.12

jobs:
  contract:
    name: Quality (CI) · Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/check-contract.py templates

  promotion-source:
    name: Quality (CI) · Promotion source
    # v1, v2... only receive promotions from develop
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          [[ $HEAD == develop && $SAME_REPO == true ]] \
            || { echo "::error::Only develop can be promoted to a major branch (got $HEAD)"; exit 1; }

  secrets:
    name: Security (CI) · Secrets (gitleaks)
    needs: [contract, promotion-source]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci/install-tools.sh "$RUNNER_TEMP/bin" gitleaks
      - run: gitleaks git --redact --no-banner --verbose --exit-code 1 .

  workflows:
    name: Security (CI) · Workflows (actionlint, zizmor)
    needs: [contract, promotion-source]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (checksum verified)
        run: |
          base=https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION
          file=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "$base/$file" -O "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $file\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" actionlint
          ./actionlint -color
      - run: pipx run "zizmor==$ZIZMOR_VERSION" --persona=regular --min-severity=medium .github/workflows

  build:
    name: Build · core main
    needs: [secrets, workflows]
    uses: ./.github/workflows/generation.yml
    permissions:
      contents: read
    with:
      mode: full
      plugin: core-main
      scan: true

  build-released:
    name: Build · released plugin
    # Off until the first plugin release that reads v1 (repository variable
    # TEST_RELEASED_PLUGIN=true): older plugins do not understand schemaVersion.
    if: vars.TEST_RELEASED_PLUGIN == 'true' && startsWith(github.base_ref || github.ref_name, 'v')
    needs: [secrets, workflows]
    uses: ./.github/workflows/generation.yml
    permissions:
      contents: read
    with:
      mode: full
      plugin: released

  approval:
    name: Approval · promote to ${{ github.base_ref }}
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && startsWith(github.base_ref, 'v') }}
    needs: [build, build-released]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: promote
    permissions: {}
    steps:
      - env:
          BASE: ${{ github.base_ref }}
        run: echo "Promotion to $BASE approved. Merging the PR publishes it to every plugin user." >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    # Single required check for rulesets
    if: always()
    needs: [contract, promotion-source, secrets, workflows, build, build-released, approval]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [[ $r == success || $r == skipped ]] || exit 1; done

  deploy:
    name: Deploy (CD) · tag v1.x.y
    # The merge into v1 already reaches users; the tag marks what they got
    # (next patch; bump minor by hand)
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    needs: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          major=${BRANCH#v}
          [[ $major =~ ^[0-9]+$ ]] || { echo "::error::$BRANCH is not a major branch"; exit 1; }
          if git describe --tags --exact-match HEAD 2>/dev/null | grep -q "^v$major\."; then
            echo "HEAD is already tagged"; exit 0
          fi
          last=$(git tag --list "v$major.*.*" | sort -V | tail -n 1)
          if [[ -z $last ]]; then
            next="v$major.0.0"
          else
            IFS=. read -r _ minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$next" -f sha="$GITHUB_SHA"
          echo "Tagged $next" >> "$GITHUB_STEP_SUMMARY"
